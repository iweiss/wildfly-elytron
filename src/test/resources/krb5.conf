[libdefaults]
	default_realm = WILDFLY.ORG
	# This aligns with newer versions of Elytron
	default_tgs_enctypes = aes128-cts-hmac-sha1-96
	default_tkt_enctypes = aes128-cts-hmac-sha1-96
	kdc_timeout = 5000
	dns_lookup_realm = false
	dns_lookup_kdc = false
	# This has been fixed on 8u402
	# https://bugs.openjdk.org/browse/JDK-8316606
	allow_weak_crypto = yes
	forwardable = true

[realms]
	WILDFLY.ORG = {
		kdc = localhost:6088
	}

[login]
	krb4_convert = true
	krb4_get_tickets = false
